<html>
    <head>
        <link rel="stylesheet" href="counter.css">
    </head>
    <body>
        <div class="container">
        <h1>People entered:</h1>
        <h2 id="count-el">0</h2>
        <h3 id="h3">Increment By:</h3>

        <input type="number" id="incrementInput" placeholder="Enter Increment">

        <div id="buttonsID">     


     

        <button id="increment-btn" onclick="increment()">INCREMENT</button>

        <button id="changeIncrement" onclick="incrementChange()">CHANGE INCREMENT</button>

        <button id="save-btn" onclick="save()">SAVE</button>

        
        </div>

        <p id="save-el">Previous entries: </p>
        </div>
        <script src="counter.js"></script>
    </body>
</html>
